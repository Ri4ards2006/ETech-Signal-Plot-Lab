name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Tests (warnings are errors)
        run: uv run pytest -W error -v
      - name: Build example plots
        run: |
          for m in fourier_demo bode_demo filters_demo sampling_demo systems_demo; do
            uv run python -m examples.$m --save plots
          done
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: example-plots
          path: plots/
