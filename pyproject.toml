[project]
name = "etech-signal-plot-lab"
version = "0.1.0"
description = "Tested DSP / circuit modules: FFT, Fourier series, Bode, filter design, sampling, step responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
